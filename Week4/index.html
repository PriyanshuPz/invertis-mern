<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Club Page</title>
  </head>
  <body>
    <h1>Tech Club Registration</h1>

    <form>
      <p>
        <label for="student-name">Name:</label><br />
        <input type="text" id="student-name" name="studentName" />
      </p>

      <p>
        <label for="student-email">Email:</label><br />
        <input type="email" id="student-email" name="studentEmail" />
      </p>

      <p>
        <label for="student-password">Password:</label><br />
        <input type="password" id="student-password" name="studentPassword" />
      </p>
    </form>
  </body>
</html>
