<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Club Page</title>
  </head>
  <body>
    <h1>Tech Club Registration</h1>

    <h2>Upcoming Events</h2>
    <table border="1">
      <thead>
        <tr>
          <th>Event</th>
          <th>Date</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Coding Workshop</td>
          <td>Nov 10, 2026</td>
          <td>Computer Lab</td>
        </tr>
        <tr>
          <td>Robotics Showcase</td>
          <td>Nov 17, 2026</td>
          <td>Innovation Hall</td>
        </tr>
        <tr>
          <td>Hackathon</td>
          <td>Nov 25, 2026</td>
          <td>Auditorium</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
          <td colspan="3">More exciting events coming soon!</td>
        </tr>
      </tfoot>
    </table>

    <h2>Registration Form</h2>
    <form>
      <p>
        <label for="student-name">Name:</label><br />
        <input type="text" id="student-name" name="studentName" />
      </p>

      <p>
        <label for="student-email">Email:</label><br />
        <input type="email" id="student-email" name="studentEmail" />
      </p>

      <p>
        <label for="student-password">Password:</label><br />
        <input type="password" id="student-password" name="studentPassword" />
      </p>

      <p>
        <label for="event-date">Event Date:</label><br />
        <input type="date" id="event-date" name="eventDate" />
      </p>

      <p>
        <label for="student-phone">Phone:</label><br />
        <input type="tel" id="student-phone" name="studentPhone" />
      </p>

      <fieldset>
        <legend>Preferred Session:</legend>
        <label>
          <input type="radio" name="session" value="morning" />
          Morning
        </label>
        <label>
          <input type="radio" name="session" value="afternoon" />
          Afternoon
        </label>
      </fieldset>

      <fieldset>
        <legend>Interests:</legend>
        <label>
          <input type="checkbox" name="interests" value="web-development" />
          Web Development
        </label>
        <label>
          <input type="checkbox" name="interests" value="robotics" />
          Robotics
        </label>
        <label>
          <input type="checkbox" name="interests" value="cybersecurity" />
          Cybersecurity
        </label>
      </fieldset>

      <p>
        <label for="event-selection">Choose an Event:</label><br />
        <select id="event-selection" name="eventSelection">
          <option value="">Select an event</option>
          <option value="coding-workshop">Coding Workshop</option>
          <option value="robotics-showcase">Robotics Showcase</option>
          <option value="hackathon">Hackathon</option>
        </select>
      </p>

      <p>
        <label for="student-message">Message:</label><br />
        <textarea
          id="student-message"
          name="studentMessage"
          rows="5"
          cols="30"
        ></textarea>
      </p>

      <button type="submit">Submit Registration</button>
    </form>
  </body>
</html>
