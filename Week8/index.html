<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Week 8 - Dashboard</title>
  </head>
  <body>
    <div class="dashboard">
      <header class="header dashboard-header">
        <h1>Student Dashboard</h1>
      </header>

      <aside class="sidebar dashboard-sidebar">
        <h2>Menu</h2>
        <a href="#">Home</a>
        <a href="#">Courses</a>
        <a href="#">Progress</a>
        <a href="#">Settings</a>
      </aside>

      <main class="main-content dashboard-main">
        <h2>Welcome back!</h2>
        <p>Here is a quick look at your learning activity.</p>
        <section class="stat-boxes">
          <div class="stat-box">
            <span class="stat-icon">📚</span>
            <div>
              <h3>Courses</h3>
              <p>4 active</p>
            </div>
          </div>
          <div class="stat-box">
            <span class="stat-icon">✓</span>
            <div>
              <h3>Lessons</h3>
              <p>18 completed</p>
            </div>
          </div>
          <div class="stat-box">
            <span class="stat-icon">★</span>
            <div>
              <h3>Points</h3>
              <p>850 earned</p>
            </div>
          </div>
          <div class="stat-box">
            <span class="stat-icon">🔥</span>
            <div>
              <h3>Streak</h3>
              <p>7 days</p>
            </div>
          </div>
        </section>
      </main>

      <footer class="footer dashboard-footer">
        <p>Student Dashboard</p>
      </footer>
    </div>
  </body>
</html>
